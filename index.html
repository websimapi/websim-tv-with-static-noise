<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV with Static Noise</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        
        #container {
            position: relative;
            width: 500px;
            height: 400px;
        }
        
        #tv-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2; /* Above the static */
            pointer-events: none;
        }
        
        #static-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="static-canvas"></canvas>
        <img id="tv-image" src="/tv_image.png" alt="TV Frame">
    </div>
    
    <script>
        // Configuration
        const STATIC_UPDATE_INTERVAL = 50; // ms between static updates
        
        // Screen area coordinates (will be set based on image dimensions)
        let screenArea = { x: 0, y: 0, width: 0, height: 0 };
        
        // Initialize
        const tvImage = document.getElementById('tv-image');
        const staticCanvas = document.getElementById('static-canvas');
        const staticCtx = staticCanvas.getContext('2d');
        
        // Setup everything once the TV image loads
        tvImage.onload = function() {
            // Set canvas dimensions to match image
            staticCanvas.width = tvImage.width;
            staticCanvas.height = tvImage.height;
            
            // Set screen area based on known TV dimensions
            // This assumes the screen is roughly centered and takes up about 60% of the TV
            // Adjust these values based on your specific TV image
            const imgWidth = tvImage.width;
            const imgHeight = tvImage.height;
            
            screenArea = {
                x: Math.floor(imgWidth * 0.2),
                y: Math.floor(imgHeight * 0.2),
                width: Math.floor(imgWidth * 0.6),
                height: Math.floor(imgHeight * 0.6)
            };
            
            // Fine-tune the screen area for the specific TV image we have
            // These values would be better determined through manual inspection
            screenArea = {
                x: Math.floor(imgWidth * 0.15),
                y: Math.floor(imgHeight * 0.15),
                width: Math.floor(imgWidth * 0.7),
                height: Math.floor(imgHeight * 0.65)
            };
            
            // Start generating static
            generateStatic();
        };
        
        // Check if a pixel is in the screen area
        function isInScreenArea(x, y) {
            return (x >= screenArea.x && 
                    x < screenArea.x + screenArea.width && 
                    y >= screenArea.y && 
                    y < screenArea.y + screenArea.height);
        }
        
        // Generate static noise effect
        function generateStatic() {
            staticCtx.clearRect(0, 0, staticCanvas.width, staticCanvas.height);
            
            // Create static noise only in the screen area
            const imageData = staticCtx.createImageData(staticCanvas.width, staticCanvas.height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                const x = (i / 4) % staticCanvas.width;
                const y = Math.floor((i / 4) / staticCanvas.width);
                
                if (isInScreenArea(x, y)) {
                    // Random black or white for each pixel in the screen area
                    const value = Math.random() > 0.5 ? 255 : 0;
                    data[i] = value;     // R
                    data[i + 1] = value; // G
                    data[i + 2] = value; // B
                    data[i + 3] = 255;   // A (fully opaque)
                } else {
                    // Outside screen area is transparent
                    data[i + 3] = 0;
                }
            }
            
            staticCtx.putImageData(imageData, 0, 0);
            
            // Schedule next frame
            setTimeout(generateStatic, STATIC_UPDATE_INTERVAL);
        }
    </script>
